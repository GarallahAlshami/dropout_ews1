name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate data and train models
        run: python generate_and_train.py
      - name: Validate generated artifacts
        run: |
          test -s data/students.csv
          test -s models/metrics.json
          test -s models/feature_cols.joblib
          test -s models/logistic_regression.joblib
          test -s models/xgboost.joblib
